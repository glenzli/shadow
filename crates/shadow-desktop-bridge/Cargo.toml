[package]
name = "shadow-desktop-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
cxx.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shadow-bridge.workspace = true
shadow-cache.workspace = true
shadow-catalog.workspace = true
shadow-core.workspace = true
shadow-domain.workspace = true
shadow-library-sharing.workspace = true
shadow-native-path.workspace = true
shadow-ai.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
time.workspace = true
tempfile.workspace = true
uuid.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[build-dependencies]
cxx-build = "=1.0.198"

# CXX generates the ABI shims; all handwritten APIs in this crate remain safe.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
