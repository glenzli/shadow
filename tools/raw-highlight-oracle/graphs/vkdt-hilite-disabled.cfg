# Same pinned vkdt graph and output contract as vkdt-hilite.cfg, with only the raw-mosaic
# highlight reconstruction node removed.  This is the strict within-vkdt ablation baseline.
module:i-raw:main
module:denoise:01
module:demosaic:01
module:colour:01
module:o-pfm:main
connect:i-raw:main:output:denoise:01:input
connect:denoise:01:output:demosaic:01:input
connect:demosaic:01:output:colour:01:input
connect:colour:01:output:o-pfm:main:input
param:colour:01:exposure:0
param:i-raw:main:filename:none.raw
