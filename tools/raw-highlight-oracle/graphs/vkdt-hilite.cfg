# Adapted from vkdt's default raw graph at b95b3a0ae88959589dc11d07c9040aead5acd1f8.
# The development harness supplies the input filename through vkdt-cli --config and replaces
# this PFM sink's filename from the command line.
module:i-raw:main
module:denoise:01
module:hilite:01
module:demosaic:01
module:colour:01
module:o-pfm:main
connect:i-raw:main:output:denoise:01:input
connect:denoise:01:output:hilite:01:input
connect:hilite:01:output:demosaic:01:input
connect:demosaic:01:output:colour:01:input
connect:colour:01:output:o-pfm:main:input
param:colour:01:exposure:0
param:i-raw:main:filename:none.raw
