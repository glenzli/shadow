name: Windows contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-and-desktop-bridge:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}\shadow-cargo-target
    steps:
      - name: Check out Shadow
        uses: actions/checkout@v6

      - name: Select the hosted vcpkg toolchain
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "GitHub's Windows image did not provide VCPKG_INSTALLATION_ROOT"
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install the Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Validate native path fixtures
        shell: pwsh
        run: cargo +stable test --locked --package shadow-native-path

      - name: Configure the Windows desktop graph
        shell: pwsh
        run: cmake --preset windows-desktop-dev

      - name: Compile the Rust and CXX desktop bridge
        shell: pwsh
        run: >-
          cmake --build --preset windows-desktop-dev --target
          shadow-desktop-rust-build
          shadow-folder-scan-backend-contract-test
          shadow-backend-export-contract-test

      - name: Compile the portable native image kernel
        shell: pwsh
        run: cmake --build --preset windows-desktop-dev --target shadow-image shadow-image-decode-helper
