[workspace]
members = [
    "apps/shadow-cli",
    "crates/shadow-ai",
    "crates/shadow-bridge",
    "crates/shadow-cache",
    "crates/shadow-catalog",
    "crates/shadow-core",
    "crates/shadow-desktop-bridge",
    "crates/shadow-domain",
    "crates/shadow-library-sharing",
    "crates/shadow-native-path",
    "xtask",
]
default-members = [
    "apps/shadow-cli",
    "crates/shadow-ai",
    "crates/shadow-bridge",
    "crates/shadow-cache",
    "crates/shadow-catalog",
    "crates/shadow-core",
    "crates/shadow-desktop-bridge",
    "crates/shadow-domain",
    "crates/shadow-library-sharing",
    "crates/shadow-native-path",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
authors = ["Shadow contributors"]

[workspace.dependencies]
anyhow = "1.0.102"
blake3 = "1.8.5"
chinese-lunisolar-calendar = { version = "0.2.5", default-features = false }
cxx = "=1.0.198"
quick-xml = "0.39.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "multipart"] }
infer-runtime-client = { git = "https://github.com/glenzli/infer-runtime.git", rev = "8588a945047cedaea62035969e479e7fb7ff795c" }
nix = { version = "0.29.0", default-features = false, features = ["fs", "socket", "uio", "user"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.20"
shadow-catalog = { path = "crates/shadow-catalog" }
shadow-ai = { path = "crates/shadow-ai" }
shadow-bridge = { path = "crates/shadow-bridge" }
shadow-cache = { path = "crates/shadow-cache" }
shadow-core = { path = "crates/shadow-core" }
shadow-desktop-bridge = { path = "crates/shadow-desktop-bridge" }
shadow-domain = { path = "crates/shadow-domain" }
shadow-library-sharing = { path = "crates/shadow-library-sharing" }
shadow-native-path = { path = "crates/shadow-native-path" }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.44", features = ["rt", "time"] }
tracing = "0.1.44"
uuid = { version = "1.23.2", features = ["serde", "std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Foundation artifacts are hundreds of MiB. Keep their mandatory integrity
# verification practical in the desktop debug build instead of running the
# cryptographic hot loop with opt-level 0.
[profile.dev.package.shadow-cache]
opt-level = 3

[profile.test.package.shadow-cache]
opt-level = 3
